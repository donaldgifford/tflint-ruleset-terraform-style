services:
  localstack:
    image: localstack/localstack:4.12.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,iam,sts
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - testnet

  terraform:
    image: hashicorp/terraform:1.9
    working_dir: /workspace
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./tests:/workspace
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - testnet

  tofu:
    image: ghcr.io/opentofu/opentofu:1.8
    working_dir: /workspace
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./tests:/workspace
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - testnet

networks:
  testnet:
    driver: bridge
